      <a class="brand" href="/project/scholarmatch/index.html">ScholarMatch</a>
      <nav class="nav-links" role="navigation">

  <main class="container" role="main" style="padding:2rem 0;">
    <h1>Contact Us</h1>
    <p>If you have questions or need help, send us a message.</p>

    <form action="/project/scholarmatch/submit-contact.php" method="post" style="max-width:720px; margin-top:1rem;">
      <div style="margin-bottom:0.75rem;">
        <label for="name">Name</label><br/>
        <input id="name" name="name" type="text" required style="width:100%; padding:0.6rem; border-radius:6px; border:1px solid #d1d5db;">
      </div>
      <div style="margin-bottom:0.75rem;">
        <label for="email">Email</label><br/>
        <input id="email" name="email" type="email" required style="width:100%; padding:0.6rem; border-radius:6px; border:1px solid #d1d5db;">
      </div>
      <div style="margin-bottom:0.75rem;">
        <label for="message">Message</label><br/>
        <textarea id="message" name="message" rows="6" required style="width:100%; padding:0.6rem; border-radius:6px; border:1px solid #d1d5db;"></textarea>
      </div>
      <button type="submit" class="cta" style="border:none; cursor:pointer;">Send message</button>
    </form>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <div>
        <a class="brand" href="/project/scholarmatch/index.html">ScholarMatch</a>
        <p style="margin-top:0.6rem; color:rgba(255,255,255,0.8)">We're here to help.</p>
      </div>
      <div>
        <h4>Support</h4>
        <ul class="footer-links">
          <li><a href="/project/scholarmatch/faq.html">FAQ</a></li>
          <li><a href="/project/scholarmatch/help.html">Help Center</a></li>
        </ul>
      </div>
      <div>
        <h4>Legal</h4>
        <ul class="footer-links">
          <li><a href="/project/scholarmatch/privacy.html">Privacy</a></li>
        </ul>
      </div>
    </div>

    <div class="footer-bottom">
      <div>© <span id="year2"></span> ScholarMatch</div>
      <div>Contact support: support@scholarmatch.example</div>
    </div>
  </footer>

  <script>document.getElementById('year2').textContent = new Date().getFullYear();</script>
</body>
</html>
